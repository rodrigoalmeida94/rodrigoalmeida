{{ define "main" }}
<div class="container">
    <div class="command-line mb-4">
        <span class="prompt-user">➜</span> <span class="prompt-path">~/{{ .Type }}</span> <span
            class="prompt-command">ls -latR</span>
    </div>
    <div class="terminal-output">
        <ul class="ls-list">
            {{ range .Pages }}
            <li class="ls-row">
                <span class="ls-perms">-rw-r--r--</span>
                <span class="ls-date">{{ .Date.Format "2006-01-02" }}</span>
                <a class="ls-name" href="{{ .Permalink }}">{{ .Title }}.md</a>
            </li>
            {{ end }}
        </ul>
    </div>
</div>
{{ end }}
